---
- summary: |
    Валидация поля ввода пароля при использовании символов кириллицы при регистрации
  requirement: |
    Валидация входных данных на формах регистрации и входа
  prerequisites: |
    Открыта страница регистрации Codebattle (/signup)
  test-data: |
    Nickname: "tester123", Email: "test@example.com", Password: "12345678ы"
  steps:
    - Ввести валидный Nickname "tester123" и Email "test@example.com"
    - Ввести "12345678ы" в поле Password
    - Повторить "12345678ы" в поле Password Confirmation
    - Нажать кнопку "Submit"
  expected-result: |
    Система отображает ошибку валидации "Should contain at least one letter" и блокирует отправку формы

- summary: |
    Создание игры с выбором языка программирования
  requirement: |
    Возможность создания игры с выбором языка программирования
  prerequisites: |
    Авторизованный пользователь находится в главном лобби
  test-data: |
    Язык программирования: "Python"
  steps:
    - Нажать кнопку "Создать игру" (Create Game)
    - В выпадающем списке выбора языка выбрать "Python"
    - Подтвердить создание комнаты
  expected-result: |
    Игра успешно создается, открывается комната ожидания, выбранный язык "Python" зафиксирован для сессии

- summary: |
    Создание и переход в приватную игру по ссылке-приглашению
  requirement: |
    Возможность создания игры с другом по прямой ссылке
  prerequisites: |
    Пользователь 1 находится в лобби
  test-data: |
    Ссылка на приватную комнату
  steps:
    - Создать приватную игру с другом
    - Скопировать сгенерированную ссылку-приглашение
    - Пользователь 2 переходит по данной ссылке
  expected-result: |
    Пользователь 2 успешно подключается к приватной комнате Пользователя 1

- summary: |
    Синхронизация написания кода соперника в режиме реального времени
  requirement: |
    Возможность проведения соревнования двух игроков в решении задач с трансляцией кода в реальном времени
  prerequisites: |
    Два игрока находятся в одной активной игровой сессии
  test-data: |
    Ввод кода в редактор решения
  steps:
    - Игрок 1 начинает вводить код в своем редакторе
    - Игрок 2 наблюдает за окном отображения кода соперника
  expected-result: |
    Вводимый Игроком 1 код отображается у Игрока 2 в режиме реального времени без задержек

- summary: |
    Запуск тестов кода и трансляция результатов обоим игрокам
  requirement: |
    Автоматический запуск тестов для введенного решения и вывод результатов
  prerequisites: |
    Игроки находятся в активном матче, написан вариант решения
  test-data: |
    Кнопка запуска тестов "Run"
  steps:
    - Ввести код решения в редактор
    - Нажать кнопку "Run"
  expected-result: |
    Тесты выполняются, результаты прохождения (pass/fail) отображаются в консоли игрока и транслируются сопернику

- summary: |
    Общение игроков и зрителей в чате внутри игровой сессии
  requirement: |
    Наличие чата для участников и зрителей внутри игровой комнаты
  prerequisites: |
    В игровой комнате находятся два игрока и зритель
  test-data: |
    Сообщение: "Good luck, have fun!"
  steps:
    - Ввести сообщение в поле ввода чата
    - Нажать клавишу Enter или кнопку отправки
  expected-result: |
    Сообщение мгновенно отображается в окне чата у всех участников сессии с указанием никнейма отправителя

- summary: |
    Автоматическая фиксация победы при успешном прохождении всех тестов
  requirement: |
    Автоматическая фиксация победы и завершение матча при прохождении всех тестов
  prerequisites: |
    Идет активный игровой матч
  test-data: |
    Код решения, проходящий 100% тестов
  steps:
    - Ввести верный код решения задачи
    - Нажать кнопку "Run"
  expected-result: |
    Все тесты пройдены, система завершает игру, фиксирует победу игрока и выводит модальное окно с результатом

- summary: |
    Запуск одиночной игры в режиме "Игра с ботом"
  requirement: |
    Наличие режима одиночной игры с виртуальным соперником ("Игра с ботом")
  prerequisites: |
    Пользователь находится в главном меню
  test-data: |
    Режим: "Игра с ботом", Язык: "JavaScript"
  steps:
    - Выбрать режим "Игра с ботом"
    - Выбрать язык "JavaScript" и нажать кнопку старта
  expected-result: |
    Сессия запускается немедленно без ожидания реального игрока, виртуальный бот подключается в качестве соперника

- summary: |
    Отображение и обновление таблицы лидеров (лидерборд)
  requirement: |
    Наличие и актуализация общего рейтинга пользователей (лидерборд)
  prerequisites: |
    Пользователь завершил рейтинговый матч
  test-data: |
    Раздел "Leaderboard"
  steps:
    - Перейти на страницу "Leaderboard"
    - Проверить позиции участников и начисленные баллы
  expected-result: |
    Таблица лидеров отображает актуальный список пользователей, очки после последнего матча пересчитаны корректно

- summary: |
    Запрет на редактирование кода соперника
  requirement: |
    Полный запрет на редактирование кода в окне соперника (режим read-only)
  prerequisites: |
    Идет активный матч с двумя участниками
  test-data: |
    Окно отображения кода соперника
  steps:
    - Кликнуть мышью по области кода соперника
    - Попробовать ввести символы с клавиатуры
  expected-result: |
    Область кода соперника защищена от редактирования (read-only), ввод и удаление символов невозможны

- summary: |
    Блокировка ввода кода после окончания игры
  requirement: |
    Блокировка ввода и редактирования кода после официального окончания матча
  prerequisites: |
    Игра официально завершена (определен победитель)
  test-data: |
    Окно редактора кода
  steps:
    - Кликнуть в область собственного редактора кода
    - Попробовать изменить или дополнить код
  expected-result: |
    Редактор кода заблокирован для ввода, изменение текста решения невозможно

- summary: |
    Обработка внезапного отключения игрока во время матча
  requirement: |
    Корректная обработка разрыва соединения (дисконнекта) одного из игроков с уведомлением второго участника
  prerequisites: |
    Идет активный матч
  test-data: |
    Закрытие вкладки браузера Игроком 1
  steps:
    - Игрок 1 закрывает вкладку браузера во время игры
    - Игрок 2 продолжает находиться на странице сессии
  expected-result: |
    Система фиксирует разрыв соединения, выводит Игроку 2 уведомление "Opponent disconnected" и запускает таймер ожидания переподключения

- summary: |
    Сохранение введенного кода при случайной перезагрузке страницы
  requirement: |
    Сохранение набранного кода при случайной перезагрузке страницы в рамках сессии
  prerequisites: |
    В редактор введен промежуточный код решения
  test-data: |
    Перезагрузка страницы (F5)
  steps:
    - Написать несколько строк кода в редакторе
    - Обновить страницу браузера (F5 / Cmd+R)
  expected-result: |
    После повторного подключения к сессии ранее введенный код сохраняется в редакторе

- summary: |
    Проверка изоляции среды выполнения кода (Sandbox)
  requirement: |
    Безопасная изоляция среды выполнения пользовательского кода (Sandbox)
  prerequisites: |
    Пользователь находится в редакторе кода
  test-data: |
    Код: "import os; os.system('rm -rf /')"
  steps:
    - Ввести в редактор код с системным вызовом
    - Нажать кнопку запуска тестов
  expected-result: |
    Песочница перехватывает и блокирует выполнение опасного кода, возвращается ошибка выполнения, сервер работает стабильно

- summary: |
    Адаптивность интерфейса на мобильных устройствах
  requirement: |
    Полная адаптивность и удобство использования на мобильных устройствах
  prerequisites: |
    Открыта страница игровой сессии в эмуляторе DevTools
  test-data: |
    Разрешение экрана: 375x667 (iPhone SE)
  steps:
    - Переключить браузер в режим эмуляции мобильного экрана (375px)
    - Проверить отображение редактора кода, чата и кнопок управления
  expected-result: |
    Интерфейс корректно адаптирован: элементы не перекрывают друг друга, кнопки кликабельны, горизонтальный скролл отсутствует

- summary: |
    Отображение статуса онлайн (зеленый индикатор) участников матча при просмотре игры неавторизованным пользователем
  requirement: |
    Корректное отображение статуса присутствия (онлайн/офлайн) участников матча для всех наблюдателей, включая неавторизованных пользователей
  prerequisites: |
    В системе запущен активный матч между двумя игроками
  test-data: |
    Неавторизованная сессия (гость / незалогиненный пользователь)
  steps:
    - Открыть страницу активного матча без входа в аккаунт (в режиме гостя)
    - Проверить визуальный индикатор статуса присутствия рядом с никнеймами игроков
  expected-result: |
    Рядом с никнеймами игроков, находящихся в сети, отображается зеленый индикатор статуса (online), независимо от авторизации наблюдателя
