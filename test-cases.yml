---
- summary: |
    Успешная регистрация нового пользователя
  requirement: |
    Регистрация нового пользователя и авторизация в системе
  prerequisites: |
    Открыта страница регистрации Codebattle (/signup)
  test-data: |
    Nickname: "valid_user_2026", Email: "valid_user_2026@example.com", Password: "Password123!"
  steps:
    - Ввести валидный Nickname "valid_user_2026"
    - Ввести валидный Email "valid_user_2026@example.com"
    - Ввести "Password123!" в поле Password
    - Повторить "Password123!" в поле Password Confirmation
    - Нажать кнопку "Submit"
  expected-result: |
    Учетная запись успешно создается, происходит автоматическая авторизация и перенаправление пользователя на главную страницу (лобби)

- summary: |
    Успешная авторизация существующего пользователя
  requirement: |
    Регистрация нового пользователя и авторизация в системе
  prerequisites: |
    Существует зарегистрированный аккаунт; открыта страница входа (/signin)
  test-data: |
    Email: "valid_user_2026@example.com", Password: "Password123!"
  steps:
    - Ввести зарегистрированный Email "valid_user_2026@example.com"
    - Ввести корректный Password "Password123!"
    - Нажать кнопку "Sign In"
  expected-result: |
    Авторизация проходит успешно, пользователь перенаправляется в лобби под своей учетной записью

- summary: |
    Валидация поля ввода пароля при использовании символов кириллицы при регистрации
  requirement: |
    Валидация входных данных на формах регистрации и входа
  prerequisites: |
    Открыта страница регистрации Codebattle (/signup)
  test-data: |
    Nickname: "tester123", Email: "test@example.com", Password: "12345678ыs"
  steps:
    - Ввести валидный Nickname "tester123" и Email "test@example.com"
    - Ввести "12345678ыs" в поле Password
    - Повторить "12345678ыs" в поле Password Confirmation
    - Нажать кнопку "Submit"
  expected-result: |
    Система отображает ошибку валидации "Should contain at least one letter" и блокирует отправку формы

- summary: |
    Выбор предпочтительного языка программирования в настройках профиля
  requirement: |
    Возможность выбора предпочтительного языка программирования в настройках профиля пользователя (Coding preferences)
  prerequisites: |
    Авторизованный пользователь находится на главной странице
  test-data: |
    Язык программирования: "Python"
  steps:
    - Кликнуть по меню профиля пользователя в верхнем правом углу
    - Выбрать пункт меню "Settings"
    - В блоке "Coding preferences" открыть выпадающий список "Your weapon"
    - Выбрать из списка язык "Python"
  expected-result: |
    Выбранный язык ("Python") автоматически сохраняется в настройках и фиксируется как основной для решения задач в будущих матчах

- summary: |
    Создание игры с настройкой основных параметров (сложность, тип, время, тег)
  requirement: |
    Возможность создания игры с настройкой основных параметров (сложность, тип игры, время, выбор задачи)
  prerequisites: |
    Авторизованный пользователь находится в главном лобби
  test-data: |
    Level: "2 звезды", Game Type: "With other user", Time control: "5 min", Tag: "math"
  steps:
    - Нажать кнопку "Create game" в лобби
    - Выбрать уровень сложности (Level) "2 звезды"
    - Выбрать тип игры (Game Type) "With other user"
    - Установить контроль времени (Time control) "5 min"
    - Выбрать тег задачи "math"
    - Нажать кнопку "Create battle"
  expected-result: |
    Создается публичная комната с заданными параметрами (2 звезды, 5 минут, тег math), игра появляется в списке открытых дуэлей лобби

- summary: |
    Создание приватной игры и отправка приглашения игроку из списка онлайн
  requirement: |
    Возможность создания игры с другом из списка пользователей онлайн
  prerequisites: |
    Пользователь 1 и Пользователь 2 авторизованы и находятся в главном лобби (онлайн)
  test-data: |
    Level: "1 звезда", Game Type: "With a friend", Time control: "8 min", Соперник: "User2_Nickname"
  steps:
    - Пользователь 1 нажимает кнопку "Create game" в лобби
    - Выбрать тип игры "With a friend", уровень "1 звезда", время "8 min"
    - Выбрать никнейм Пользователя 2 ("User2_Nickname") в списке доступных пользователей онлайн
    - Нажать кнопку "Create battle"
    - Пользователь 2 принимает полученное приглашение в интерфейсе
  expected-result: |
    Пользователь 2 получает и принимает приглашение, оба игрока успешно перенаправляются в общую приватную комнату, матч автоматически начинается

- summary: |
    Синхронизация написания кода соперника в режиме реального времени
  requirement: |
    Возможность проведения соревнования двух игроков в решении задач с трансляцией кода в реальном времени
  prerequisites: |
    Два игрока находятся в одной активной игровой сессии
  test-data: |
    Ввод кода в редактор решения
  steps:
    - Игрок 1 начинает вводить код в своем редакторе
    - Игрок 2 наблюдает за окном отображения кода соперника
  expected-result: |
    Вводимый Игроком 1 код отображается у Игрока 2 в режиме реального времени без задержек

- summary: |
    Запуск тестов с некорректным решением задачи
  requirement: |
    Автоматический запуск тестов для введенного решения и вывод результатов
  prerequisites: |
    Игрок находится в активном матче с задачей "Square of number" (возвести число n в квадрат)
  test-data: |
    Код решения: "def solution(n): return n + 1"
  steps:
    - Ввести неверный код решения "def solution(n): return n + 1" в область редактора
    - Нажать кнопку "Run" для запуска тестов
  expected-result: |
    Тесты выполняются, в консоли результатов отображается статус проверки (Fail / Red) с подробной информацией о несовпадении результатов, игра продолжается

- summary: |
    Запуск тестов с корректным решением задачи и автоматическая фиксация победы
  requirement: |
    Автоматическая фиксация победы и завершение матча при прохождении всех тестов
  prerequisites: |
    Игрок находится в активном матче с задачей "Square of number" (возвести число n в квадрат)
  test-data: |
    Код решения: "def solution(n): return n * n"
  steps:
    - Ввести верный код решения "def solution(n): return n * n" в область редактора
    - Нажать кнопку "Run" для запуска тестов
  expected-result: |
    Все тесты успешно пройдены (Pass / Green), система автоматически завершает матч, фиксирует победу игрока и выводит модальное окно с результатом

- summary: |
    Общение игроков и зрителей в чате внутри игровой сессии
  requirement: |
    Наличие чата для участников и зрителей внутри игровой комнаты
  prerequisites: |
    В игровой комнате находятся два игрока и зритель
  test-data: |
    Сообщение: "Good luck, have fun!"
  steps:
    - Ввести сообщение в поле ввода чата
    - Нажать клавишу Enter или кнопку отправки
  expected-result: |
    Сообщение мгновенно отображается в окне чата у всех участников сессии с указанием никнейма отправителя

- summary: |
    Запуск одиночной игры в режиме "Игра с ботом"
  requirement: |
    Наличие режима одиночной игры с виртуальным соперником ("Игра с ботом")
  prerequisites: |
    Пользователь находится в главном меню
  test-data: |
    Level: "1 звезда", Game Type: "With a bot", Time control: "8 min"
  steps:
    - Нажать кнопку "Create game"
    - Выбрать тип игры "With a bot", уровень сложности "1 звезда", время "8 min"
    - Нажать кнопку "Create battle"
  expected-result: |
    Сессия запускается немедленно без ожидания реального игрока, в комнату автоматически подключается виртуальный бот в качестве оппонента

- summary: |
    Отображение и обновление таблицы лидеров (лидерборд)
  requirement: |
    Наличие и актуализация общего рейтинга пользователей (лидерборд)
prerequisites: |
    Пользователь завершил рейтинговый матч
  test-data: |
    Раздел "Leaderboard"
  steps:
    - Перейти на страницу "Leaderboard"
    - Проверить позиции участников и начисленные баллы
  expected-result: |
    Таблица лидеров отображает актуальный список пользователей, очки после последнего матча пересчитаны корректно

- summary: |
    Запрет на редактирование кода соперника
  requirement: |
    Полный запрет на редактирование кода в окне соперника (режим read-only)
  prerequisites: |
    Идет активный матч с двумя участниками
  test-data: |
    Окно отображения кода соперника
  steps:
    - Кликнуть мышью по области кода соперника
    - Попробовать ввести символы с клавиатуры
  expected-result: |
    Область кода соперника защищена от редактирования (read-only), ввод и удаление символов невозможны

- summary: |
    Блокировка ввода кода после окончания игры
  requirement: |
    Блокировка ввода и редактирования кода после официального окончания матча
  prerequisites: |
    Игра официально завершена (определен победитель)
  test-data: |
    Окно редактора кода
  steps:
    - Кликнуть в область собственного редактора кода
    - Попробовать изменить или дополнить код
  expected-result: |
    Редактор кода заблокирован для ввода, изменение текста решения невозможно

- summary: |
    Сохранение введенного кода при случайной перезагрузке страницы
  requirement: |
    Сохранение набранного кода при случайной перезагрузке страницы в рамках сессии
  prerequisites: |
    В редактор введен промежуточный код решения
  test-data: |
    Перезагрузка страницы (F5)
  steps:
    - Написать несколько строк кода в редакторе
    - Обновить страницу браузера (F5 / Cmd+R)
  expected-result: |
    После повторного подключения к сессии ранее введенный код сохраняется в редакторе

- summary: |
    Проверка изоляции среды выполнения кода (Sandbox)
  requirement: |
    Безопасная изоляция среды выполнения пользовательского кода (Sandbox)
  prerequisites: |
    Пользователь находится в редакторе кода
  test-data: |
    Код: "import os; os.system('rm -rf /')"
  steps:
    - Ввести в редактор код с системным вызовом
    - Нажать кнопку запуска тестов
  expected-result: |
    Песочница перехватывает и блокирует выполнение опасного кода, возвращается ошибка выполнения, сервер работает стабильно

- summary: |
    Адаптивность интерфейса на мобильных устройствах
  requirement: |
    Полная адаптивность и удобство использования на мобильных устройствах
  prerequisites: |
    Открыта страница игровой сессии в эмуляторе DevTools
  test-data: |
    Разрешение экрана: 375x667 (iPhone SE)
  steps:
    - Переключить браузер в режим эмуляции мобильного экрана (375px)
    - Проверить отображение редактора кода, чата и кнопок управления
  expected-result: |
    Интерфейс корректно адаптирован: элементы не перекрывают друг друга, кнопки кликабельны, горизонтальный скролл отсутствует

- summary: |
    Отображение статуса онлайн (зеленый индикатор) участников матча при просмотре игры неавторизованным пользователем
  requirement: |
    Корректное отображение статуса присутствия (онлайн/офлайн) участников матча для всех наблюдателей, включая неавторизованных пользователей
  prerequisites: |
    В системе запущен активный матч между двумя игроками
  test-data: |
    Неавторизованная сессия (гость / незалогиненный пользователь)
  steps:
    - Открыть страницу активного матча без входа в аккаунт (в режиме гостя)
    - Проверить визуальный индикатор статуса присутствия рядом с никнеймами игроков
  expected-result: |
    Рядом с никнеймами игроков, находящихся в сети, отображается зеленый индикатор статуса (online), независимо от авторизации наблюдателя
